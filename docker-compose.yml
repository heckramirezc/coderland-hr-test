version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marcasdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: dotnet_api
    restart: always
    ports:
      - "8081:8080" 
    environment:
      CONNECTION_STRING: Host=db;Port=5432;Database=marcasdb;Username=postgres;Password=password
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - db
    
volumes:
  postgres_data:
